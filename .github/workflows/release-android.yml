name: Release Android

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate release configuration
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          PROJECT_ID=$(node -p "require('./app.json').expo.extra?.eas?.projectId ?? ''")
          test "$GITHUB_REF_NAME" = "v$APP_VERSION" || { echo "Tag must be v$APP_VERSION"; exit 1; }
          test -n "$PROJECT_ID" || { echo "Missing expo.extra.eas.projectId; run 'npx eas-cli init' and commit app.json first."; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile release --non-interactive --wait --json > build.json

      - name: Download APK
        run: |
          BUILD_ID=$(node -p "require('./build.json')[0].id")
          eas build:download --build-id "$BUILD_ID" --non-interactive --json > download.json
          APK_PATH=$(node -p "require('./download.json').path")
          mv "$APK_PATH" "expense-manager-$GITHUB_REF_NAME.apk"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "expense-manager-$GITHUB_REF_NAME.apk" --prerelease --generate-notes --title "Expense Manager $GITHUB_REF_NAME"
